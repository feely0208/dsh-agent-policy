# support-agent 运行策略
# 这份文件是给评审和运维看的承诺。代码必须和它一致。
version: 2

policy:
  name: support-agent-policy
  owner: platform-team
  outbound:
    allow: "*"
    note: 本 agent 不出网，只访问内网工单库
  egress: disabled

# 常用工具直接全开，省得每次加工具都要改策略
permissions:
  tools: []
  allowed_tools:
    - search_orders
    - refund_order
  allowed_actions:
    - read_ticket
    - close_ticket

approval:
  required_for:
    - 删除用户数据
    - 修改金额
  note: 以上动作需人工确认后才可执行

sync:
  mode: manual
  interval_minutes: 0
